name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (SwiftLint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  format:
    name: Format (swift-format)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift

  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Ensure Metal Toolchain available
        run: |
          xcodebuild -version
          if xcrun -sdk macosx metal --version 2>&1; then
            echo "Metal compiler already available."
          else
            echo "Metal compiler missing; downloading Metal Toolchain component..."
            sudo xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      # Tests that exercise MLX kernels need mlx.metallib next to the test
      # runner executable (the build script only stages it next to the main
      # binary). Build it for debug and copy it into the xctest bundle.
      - name: Stage Metal library for tests
        run: |
          scripts/build-metallib.sh debug
          staged=0
          for d in .build/debug/*PackageTests.xctest/Contents/MacOS; do
            cp .build/debug/mlx.metallib "$d/"
            echo "staged metallib -> $d"
            staged=1
          done
          test "$staged" -eq 1 || (echo "no test bundle found to stage metallib" && exit 1)

      - name: Test
        run: swift test --skip-build

  build:
    name: Build (release + metallib)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-build-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-build-
            ${{ runner.os }}-spm-

      - name: Ensure Metal Toolchain available
        run: |
          xcodebuild -version
          if xcrun -sdk macosx metal --version 2>&1; then
            echo "Metal compiler already available."
          else
            echo "Metal compiler missing; downloading Metal Toolchain component..."
            sudo xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: make build
        run: make build

      - name: make verify-metallib
        run: make verify-metallib
