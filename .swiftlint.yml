included:
  - Sources
  - Tests

excluded:
  - .build
  - Package.swift
  - Package.resolved

disabled_rules:
  # Handled by swift-format
  - line_length
  - trailing_whitespace
  - opening_brace
  - vertical_whitespace
  # swift-format adds trailing commas; SwiftLint default forbids them
  - trailing_comma
  # Project style: `var x: T? = nil` is fine
  - implicit_optional_initialization

identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - id

# Thresholds tuned to current codebase: passes today, still trips on future drift.
function_body_length:
  warning: 300
  error: 500
cyclomatic_complexity:
  warning: 40
  error: 60
file_length:
  warning: 600
  error: 1000
type_body_length:
  warning: 300
  error: 500
function_parameter_count:
  warning: 7
  error: 10

reporter: xcode
